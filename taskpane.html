<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Message Notes</title>
  <link rel="icon" href="./assets/icon-32.png">
  <link rel="stylesheet" href="./styles.css?v=1.1.0">
  <script type="module" src="./app.js?v=1.1.0"></script>
</head>
<body class="taskpane-body">
  <div id="demoTools" class="demo-tools" hidden>
    <strong>DEMO &middot; sample emails only</strong>
    <label for="demoItem">Switch sample email</label>
    <select id="demoItem">
      <option value="0">1. Updated documents</option>
      <option value="1">2. Friday meeting</option>
      <option value="2">3. Same subject, different email</option>
      <option value="-1">No message selected</option>
    </select>
  </div>

  <main class="note-app" aria-label="Message Notes">
    <div id="fatal" class="notice error" role="alert" hidden></div>

    <div class="format-toolbar" role="toolbar" aria-label="Note formatting">
      <button class="format-button" id="bold" type="button" title="Bold (Ctrl+B)" aria-label="Bold"><strong>B</strong></button>
      <button class="format-button italic-button" id="italic" type="button" title="Italic (Ctrl+I)" aria-label="Italic">I</button>
      <button class="format-button underline-button" id="underline" type="button" title="Underline (Ctrl+U)" aria-label="Underline">U</button>
      <span class="toolbar-divider" aria-hidden="true"></span>
      <label class="sr-only" for="fontSize">Font size</label>
      <select id="fontSize" class="font-size" title="Font size" aria-label="Font size">
        <option value="12">12</option>
        <option value="14" selected>14</option>
        <option value="16">16</option>
        <option value="18">18</option>
        <option value="20">20</option>
        <option value="24">24</option>
      </select>
      <label class="color-control" title="Text color" aria-label="Text color">
        <span class="color-a" aria-hidden="true">A</span>
        <input id="textColor" type="color" value="#c50f1f" aria-label="Text color">
      </label>
    </div>

    <div
      id="note"
      class="note-editor"
      contenteditable="false"
      role="textbox"
      aria-multiline="true"
      aria-label="Note for this email"
      data-placeholder="Add a note..."
      spellcheck="true"></div>

    <div id="error" class="notice error compact-notice" role="alert" hidden></div>
    <button id="recover" class="text-action" type="button" hidden>Reload saved note</button>

    <div class="save-area">
      <button id="save" class="primary save-button" type="button" disabled>Save</button>
      <span id="status" class="save-status" role="status" aria-live="polite">Loading…</span>
    </div>
  </main>
</body>
</html>
